; ===========================================================================
; gpxinput —— RDR2 扳机震动 mod 配置
;
; ★ 当前可用范围（请先看这一段）★
;
;   可用：1) 开枪时扳机给一个脉冲（XInput 没有扳机这一路，所以由我们自己造）
;         2) 按下 LT 时左侧给一下短反馈
;
;   未完成、且问题较多（本包不含对应组件，默认不生效）：
;         · 武器识别 / 不同枪不同手感      —— 需要游戏内状态组件，未随包提供
;         · 瞄准持续微震、久瞄变抖          —— 同上
;         · 骑乘辅助震动                    —— 判据在 RDR2 上不可靠，默认关闭
;
; 游戏自己的震动照常保留 —— 我们是「叠加」在它之上，不是替换它。
;
; 安装：把本文件和 xinput9_1_0.dll 一起放进游戏 exe 所在目录（RDR2 就是
;       游戏根目录），然后以管理员身份启动游戏。卸载：删掉这两个文件即可，
;       游戏不会留下任何痕迹。
; ===========================================================================

[Proxy]

; 排查问题时改成 debug（会记录每次识别到的冲击和步态）；日常用 info。
LogLevel=info

; 2 = 阻断替换：由我们按 125Hz 驱动手柄。
; 这是唯一能在「游戏不发震动的间隙」继续输出辅助震动的模式。
; 1 = 改写：也能用，但只会在游戏自己发震动的那一刻更新输出，骑马辅助
;     会变成一顿一顿的；0 = 完全不动（只观察）。
Mode=2

; 输出通道 —— 决定扳机那两路「从哪出去」
;   0 = 自动      优先 Windows.Gaming.Input，其次 HID，最后 XInput
;   1 = 只用 XInput      两个马达。扳机放不出去，内容会折算到体感马达。
;   2 = 只用 HID         9 字节输出报告，四电机。需要设备暴露可写报告 + 管理员。
;   3 = 只用 Windows.Gaming.Input   四电机，不需要管理员。
;
; 为什么不能只做 HID：XInput 的 API 里根本没有扳机震动这一路，必须另找出口，
; 而能用的出口有两个、彼此独立：
;   · HID 输出报告 —— 要设备暴露可写的 9 字节报告，还要管理员权限。很多手柄
;     （第三方、部分无线连接）根本不暴露，这条路直接废掉。
;   · Windows.Gaming.Input 的 GamepadVibration —— 走手柄驱动栈，原生含左右
;     扳机，不依赖 HID 输出报告，也不要管理员。网页版手柄测试用的就是它。
; 只实现 HID 的后果是「扳机永远不震、体感照常」，看着像硬件不支持。
; 自动模式两条都试，日志里会写明最后用了哪条（找「输出通道=」那一行）。
Output=0

; 允许输出扳机震动。走 Windows.Gaming.Input 时不需要管理员；走 HID 时需要。
; 手柄没有 HID 输出接口时（多数第三方手柄）这一项自动失效 —— 此时扳机的
; 内容会按下面 TrigToBody 折算到同侧身体马达上，手感不会白丢。
Triggers=true

TimeoutMs=2
HookRealXInput=true
HookDeviceIoControl=true

; 调参时打开：把游戏发来的每一帧震动录成 CSV（末尾两列是手柄扳机的实时
; 按压量，用来对着看「扣扳机 ↔ 震动」的对应关系）。格式与加工端一致，
; 可以用 xinput_test.exe --replay 回放。日常玩请留空，否则文件会长大。
CaptureFile=E:\111FWQ\xboxsbzd\build\rdr2\rdr2_shot_test.csv

; ---------------------------------------------------------------------------
; 监视窗口（DOS 窗口，实时显示四个电机）
; ---------------------------------------------------------------------------
; 把「游戏原值 / 最终输出 / 手柄扳机输入 / 合成状态」写进一个只读共享段。
; 关掉它没有任何影响，只是监视窗口看不到数据。
MonitorEnable=true

; 启动游戏时自动拉起同目录的 gp_monitor.exe（它自带一个控制台窗口）。
; 想自己按需启动就把这里改成 false，然后手动双击 gp_monitor.exe。
MonitorAutoStart=false

; 监视器路径。留空 = 与代理同目录的 gp_monitor.exe（推荐）。
MonitorExe=

; ---------------------------------------------------------------------------
; 震动合成参数
; ---------------------------------------------------------------------------
[Haptics]

; 自合成总开关。关掉它，这个 mod 就退化成「什么都不做」的代理。
SelfHaptics=true

; --- 逐路直通（四个电机各自独立）---
; 设成 false 的那一路 = **完全由游戏原值决定**：我们的合成内容（开枪脉冲、
; 骑乘辅助、瞄准震动，以及「没有 HID 时把扳机折算到体感」那条通路）都不会
; 落到它上面，游戏给什么就发什么。
;
; 典型用法：
;   想「体感保持原汁原味，只让扳机动」  -> DriveLeftMotor / DriveRightMotor = false
;   想「只要体感，扳机不要我们补的」    -> DriveLeftTrigger / DriveRightTrigger = false
;
; 注意：手柄**没有扳机通道**时（多数第三方手柄、部分无线连接），开枪那一下
; 是靠把扳机内容折算到同侧体感发出来的（TrigToBody）。把体感设成直通，
; 那一下也就跟着没了 —— 这种情况下要么保留体感参与，要么把 ShotSide 改成 1
; 让开枪只走左侧。
DriveLeftMotor=true
DriveRightMotor=true
DriveLeftTrigger=true
DriveRightTrigger=true

; --- 开枪 ---
; 开枪判据一：**右扳机扣下**（RDR2 开枪就是 RT）。
; 这是主力判据 —— 代理直接读手柄，不依赖任何波形分析，手感上「扣下去就震」。
; **兜底判据**：没有游戏状态时，开枪就是「RT 扣下」——代理直接读手柄，
; 不看游戏，所以任何时刻都可用。发布包不含状态组件，靠的就是这条。
;
; 它的固有毛病要说清楚：RDR2 里 RT 不只在开枪时扣（菜单、交互、加载阶段
; 都会扣到阈值），那些场合也会给一下脉冲。有状态组件时开枪改由「子弹减少」
; 判定（每发一下、连发也准），可以把这条关掉 —— 关掉之后世界加载完之前
; 开机不会震。
ShotFromTrigger=true

; --- 开枪时的接管 ---
; 打开（默认）：开枪那一下**完全由 mod 决定** —— 脉冲期间游戏本体的震动让开，
;   输出就是我们按武器档算出来的那一下。好处是同一把枪的手感变成定值，调
;   ShotGain / ShotEnvMs / ShotBodyKick 能直接听出差别。
; 关闭：老的叠加行为（游戏原值 + 我们的脉冲）。实测游戏开枪时本体也在震
;   （就是 L=R≈120 那一段状态机取值），叠上去以后手感会随"游戏发到哪一段"而变。
;
; 注意：接管之后你摸到的强度就是下面 ShotBodyKick 那个量（没有扳机电机的手柄
; 还要再看 TrigToBody 的折算），觉得不够就加 ShotBodyKick。
ShotReplaceGame=true
; 扣到多深算「扣下」。调小 → 浅按也震（瞄准时容易误触）；调大 → 要扣得更实。
TriggerPressThresh=0.55

; 回弹量：扣下后必须松回到 (阈值-回弹量) 以下，才算「重新上膛」。
; **这一项是「开了几枪之后一直震」那个 bug 的正解**：模拟扳机在阈值附近会抖，
; 只判「越过阈值」的话一次扣下会被算成连续多次。调大会更迟钝但绝不会连震。
TriggerReleaseHyst=0.20

; 扳机判据的最小间隔（毫秒）。真枪射速远低于此，而抖动远高于此。
TriggerRefractoryMs=150

; 开枪判据二：震动波形上的瞬态冲击。
; **对 RDR2 请保持关闭**：实测它的 PC 震动是一条连续渐变（两路之和恒为 255，
; 约 2 秒走完全程），全程没有任何跳变 —— 这条判据既抓不到开枪，又会被马蹄
; 声误触发。留着是给别的游戏用的。
ShotFromRumble=false

; 相对慢速基线一次性抬升多少算一次开枪（仅当上面那条开着时有效）。
ShotRiseThresh=0.20
; 扳机脉冲的强度系数。**这一项被刻意调大了**：XInput 的扳机通道只有 0..255，
; 1.0 在扣满时刚好打满，再往上就是靠「浅扣时更响」来提升存在感。
ShotGain=2.0
; 脉冲时长（毫秒）。原版 90ms 太短、像被碰了一下；170ms 才是「砰」的一下。
ShotEnvMs=170
; 连发最小间隔（毫秒）。太小会把一次枪声的余韵算成两枪。
ShotRefractoryMs=55
; 给哪一侧扳机：0=右 1=左 2=双
ShotSide=0
; 同一次冲击附加到身体马达上的量。0 = 只动扳机；0.30 会有明确的「落地感」。
; **手柄没有扳机电机时，你真正摸到的就是这一项 + TrigToBody 折算出来的量**，
; 想更猛就加这一项（它不是 0..1 归一化值，可以直接超过 1）。
ShotBodyKick=0.30

; --- 骑马 ---
; **推荐用法（有游戏状态时）**：判据是「在马上 + 马速」，按马速给节奏 ——
; 走起来轻而慢、跑起来重而快，站着不动不给。这条判据可靠，因为马速是直接读的。
; 没有状态组件时退回波形判据：RDR2 的本体震动实测没有跳变，那条不可靠，
; 所以默认关闭（发布包不含状态组件，这一项默认就是关的）。
RideEnable=false

; 马速阈值（游戏单位/秒）：低于 RideSpeedLow 视为站着/慢走，不给辅助；
; 到 RideSpeedHigh 就是最快节奏 + 最大幅度。中间线性插值。
RideSpeedLow=2.5
RideSpeedHigh=9.0

; 幅度随马速的爬升曲线：
;   1.0 = 线性 —— 慢步的马速只有疾驰的十分之一，线性下慢步也会拿到一半强度，
;         体感就是「刚一动就咚得很重」。
;   >1  = 先弱后强 —— 一点点速度只给一点点震动，跑起来才明显。默认 1.3。
; 想要「一动就有感」就调到 1.0，想要「只有跑起来才震」就往 1.6~2.0 调。
RideCurve=1.6

; 幅度上限。速度主要靠**节奏**表达，不是靠幅度 ——
; **速度主要靠节奏表达**：起步时只是拍子变快，跑起来才稍微加重一点。
; 实测反馈：幅度跟着速度大幅涨会变成「一动就震」，不像马蹄。
RideAmpMax=0.35

; 淡入淡出的时间常数（毫秒）：
; 起步时幅度从 0 慢慢涨上来、停下时慢慢收掉，而不是跨过阈值就跳变。
; 0 = 不淡（立刻出声）。
RideFadeMs=700

; 辅助强度，以及同步到扳机的比例。
RideGain=0.9
RideTrigGain=0.35

; 一个**步态周期**的范围（毫秒）：慢步 ~1100、疾驰 ~330，按马速在两者之间插值。
; 注意这是「一个完整步态」，不是「一次踏地」—— 下面 RideBeats 会把它切成几拍。
RideMinPeriodMs=300
RideMaxPeriodMs=1250

; 马蹄是**四条腿**：一个步态周期里落地四次，第一下最重。
;   RideBeats=1  = 一步一下（简化版）
;   RideBeats=4  = 真正的马蹄声，走起来是慢而稳的四连音，跑起来变成密集蹄声
; RideBeatAccent 是后三拍相对第一拍的比例（0.6 左右最像）。
RideBeats=4
RideBeatAccent=0.6

; 波形判据（没有状态时才用）：峰值阈值、相邻间隔容差、节奏中断后保持多久。
RidePeakThresh=0.10
RidePeriodTol=0.35
RideHoldMs=1200

; 骑马时的开枪阈值倍数：马蹄本身也是瞬态冲击，靠幅度和枪声区分。
RideShotBoost=2.5

; --- 输出适配 ---
; 手柄没有 HID 输出通道时，把扳机内容折算到同侧身体马达的比例。
; 0 = 丢弃（等于白算），1 = 全部折算。
TrigToBody=0.45

; --- 游戏状态 ---
; 采信游戏状态后：开枪判据换成「弹匣减少」（每发一下，连发也准），并且启用
; 下面按武器分档的手感 + 瞄准时的持续震动。
;
; **本发布包不含状态组件（gpxinput_rdr2.asi），而且那部分功能尚未完成**，
; 所以这里默认 false；这一节和 [Weapon*] 的参数目前不产生任何效果。
; 离线时代理用的是「扳机扣下」判据 —— 也就是当前唯一可用的模式。
UseGameState=false

; 瞄准时那层持续震动的起伏频率（Hz）。0 = 完全平稳的持续感。
; 0.4 左右最像「人端着枪」，再快就变成规律的嗡嗡声、反而假。
AimBreathHz=1.50

; LT 按到多深就认为「按住了」（0..1）。它只用于「按住」的判定，而且必须
; 同时满足「武器已掏出 + 不在菜单里」—— 否则暂停菜单里按住扳机就会一直震。
AimTriggerLevel=0.24

; 按住多久才算进入瞄准（毫秒）。轻点不算瞄准：轻点是「切换/选择东西」，
; 会按下方的 TickGain 给一下反馈而不是持续震。
AimHoldMs=300

; 久瞄变抖：瞄准超过 AimRampMs 后振幅涨到 (1+AimRampGain) 倍，涨满后保持。
; 这是刻意模拟「端久了手会抖」，和游戏自身的晃动增长对得上。
AimRampMs=3500
AimRampGain=1.00

; 扳机轻点的反馈（在菜单里、或没掏出武器时轻点扳机 = 切换/选择东西）。
; 这一路和上面的 LtPressEnable 无关，它只在菜单/未持械时触发。
TickGain=0.35
TickEnvMs=45

; --- LT 按下那一下（默认关闭）---
; 原生游戏不会「一按扳机就震」，所以默认关掉；想要这个反馈再打开。
LtPressEnable=false

; --- LT 按下那一下的细节 ---
; **按下 LT 就震一下**，短促、只一下。这一路完全不依赖游戏状态（代理直接读
; 手柄的 LT 模拟量），所以它是整个 mod 里最稳的一路反馈。
; 按住不放只会在按下去的那一刻震一次，不会持续 —— 持续震动是瞄准那一路的事。
LtPressGain=0.70
LtPressEnvMs=110

; --- 拉弓（弓专用）---
; 按住 RT 拉弦期间**两个扳机一起震**，强度按拉到多满爬升（BowDrawRampMs 拉满），
; 松弦时用开枪脉冲收尾。弓没有后坐，手感主要就靠这一段张力。
; 单侧震会像普通枪，两侧一起才像「两手在拉」。0 = 关闭。
BowDrawGain=0.28
BowDrawRampMs=1100

; --- 装弹开始的反馈（默认关闭）---
; 装弹能从游戏状态里读到，所以这是一个「加新机制」的现成示例：
; 想让装弹时震一下，把 ReloadGain 调到 0.3~0.6 就行。
ReloadGain=0
ReloadEnvMs=70
ReloadSide=2

; 掏出 / 切换武器时的反馈。
DrawGain=0.55
DrawEnvMs=80

; ===========================================================================
; 武器分档 —— 不同枪不同手感
;
; Hash 是武器组的 32 位哈希（= joaat(组名)，用已知的
; GROUP_PISTOL / GROUP_SHOTGUN / GROUP_RIFLE / GROUP_THROWN / GROUP_LASSO
; 五个值反验证过算法）。改这几行没用，除非你想把某一档挂到别的武器组上。
;
; 每档五个旋钮：
;   ShotGain      开枪脉冲强度（相对值，越大越重）
;   ShotEnvMs     脉冲时长（毫秒，越长越绵、越短越脆）
;   ShotBodyKick  同一次开枪附加到体感马达的量（0 = 只动扳机）
;   AimTrig       瞄准时扳机上持续的轻微震动（0 = 关掉）
;   AimBody       瞄准时体感马达上持续的轻微震动
;   AimWobble     瞄准时的呼吸式起伏幅度（0 = 完全平稳）
;
; 想「霰弹枪更猛、左轮更脆、狙击更沉」，改这里就够了，改完重启游戏生效。
; ===========================================================================

